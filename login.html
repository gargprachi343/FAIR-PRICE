<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Specialities of India</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <link rel="stylesheet" href="./styles/loginstyles.css">
  <script defer src="script.js"></script>
</head>
<body class="bg-gray-100">

  <!-- Header -->
  <header class="header">
    <h1 class="header-title">SPECIALITIES OF INDIA</h1>
  </header>

  <!-- Gallery and Login Box -->
  <main class="main-container">
    <!-- Image Grid -->
    <div class="image-grid">

      <img src="./assests/Handicraft 2.webp" class="gallery-img"/>

    </div>

    <!-- Login Box -->
    <div class="login-box">
      <h2 class="login-title">LOGIN/SIGN UP</h2>
      <form id="loginForm" class="form">
        <input type="email" id="email" placeholder="Enter your email" class="input-field"/>
        <input type="password" id="password" placeholder="Password" class="input-field"/>
        <button type="submit" class="submit-button">SUBMIT</button>
      </form>
      <p id="message" class="message hidden"></p>
    </div>
  </main>

</body>
</html>
